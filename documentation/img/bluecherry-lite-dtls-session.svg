<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-1f2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="900" height="640" fill="#ffffff" rx="12"/><text x="450" y="26" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="700" dominant-baseline="middle" fill="#1f2937">One handshake, a long lived session: Connection ID across sleep and NAT rebinding</text><rect x="55.0" y="50" width="170" height="50" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="140.0" y="67.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="middle" fill="#1f2937">Device</text><text x="140.0" y="85.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#6b7280">behind carrier NAT</text><rect x="365.0" y="50" width="170" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" opacity="1"/><text x="450.0" y="67.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="middle" fill="#1f2937">Carrier NAT</text><text x="450.0" y="85.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#6b7280">forgets idle UDP mappings</text><rect x="675.0" y="50" width="170" height="50" rx="8" fill="#fbe9ee" stroke="#b3123a" stroke-width="1.5" opacity="1"/><text x="760.0" y="67.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" font-weight="600" dominant-baseline="middle" fill="#1f2937">BlueCherry</text><text x="760.0" y="85.5" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#6b7280">coap.bluecherry.io:5684</text><line x1="140.0" y1="100" x2="140.0" y2="600" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="450.0" y1="100" x2="450.0" y2="600" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="760.0" y1="100" x2="760.0" y2="600" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="40" y="120" width="820" height="145" rx="8" fill="none" stroke="#b3123a" stroke-width="1.2" stroke-dasharray="6 4" opacity="1"/><rect x="50" y="110" width="624" height="20" rx="4" fill="#ffffff" stroke="#b3123a" stroke-width="1.2" opacity="1"/><text x="362" y="120" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="600" dominant-baseline="middle" fill="#b3123a">Full DTLS handshake, once (ECDHE P-256, mutual certificates, CID negotiated)</text><line x1="144.0" y1="150" x2="756.0" y2="150" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow-1f2937)"/><text x="450.0" y="141.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">ClientHello  + connection_id extension</text><text x="450.0" y="141.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">ClientHello  + connection_id extension</text><line x1="756.0" y1="180" x2="144.0" y2="180" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow-1f2937)"/><text x="450.0" y="171.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">ServerHello + Certificate + KeyExchange + CertificateRequest</text><text x="450.0" y="171.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">ServerHello + Certificate + KeyExchange + CertificateRequest</text><line x1="144.0" y1="210" x2="756.0" y2="210" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow-1f2937)"/><text x="450.0" y="201.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">Certificate + KeyExchange + CertificateVerify + Finished</text><text x="450.0" y="201.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">Certificate + KeyExchange + CertificateVerify + Finished</text><line x1="756.0" y1="240" x2="144.0" y2="240" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow-1f2937)"/><text x="450.0" y="231.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">Finished   (session keys derived, session ID / ticket issued)</text><text x="450.0" y="231.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">Finished   (session keys derived, session ID / ticket issued)</text><line x1="144.0" y1="300" x2="756.0" y2="300" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><text x="450.0" y="291.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">CoAP sync, DTLS record with CID, seen by the server from address A</text><text x="450.0" y="291.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">CoAP sync, DTLS record with CID, seen by the server from address A</text><line x1="756.0" y1="322" x2="144.0" y2="322" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><text x="450.0" y="313.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">ACK</text><text x="450.0" y="313.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">ACK</text><rect x="70" y="345" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1" opacity="1"/><text x="140" y="358" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">device sleeps 2 hours,</text><text x="140" y="373" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">NAT mapping expires</text><line x1="144.0" y1="420" x2="756.0" y2="420" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><text x="450.0" y="411.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">CoAP sync, same CID, now seen from address B (new IP and port)</text><text x="450.0" y="411.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">CoAP sync, same CID, now seen from address B (new IP and port)</text><rect x="536.0" y="430.0" width="210" height="44" rx="6" fill="#e6f4ea" stroke="#15803d" stroke-width="1" opacity="1"/><text x="641.0" y="444.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">Lookup by CID, not by IP:port.</text><text x="641.0" y="460.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">Same keys, no handshake.</text><line x1="756.0" y1="490" x2="144.0" y2="490" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><text x="450.0" y="481.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">ACK (queued downlink included)</text><text x="450.0" y="481.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">ACK (queued downlink included)</text><rect x="70" y="515" width="140" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1" opacity="1"/><text x="140" y="528" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">deep sleep, RAM lost:</text><text x="140" y="543" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">DTLS state gone</text><line x1="144.0" y1="575" x2="756.0" y2="575" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-1f2937)"/><text x="450.0" y="566.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.9">abbreviated handshake: session ID (1.2) or PSK ticket (1.3), 1 RTT</text><text x="450.0" y="566.0" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#1f2937">abbreviated handshake: session ID (1.2) or PSK ticket (1.3), 1 RTT</text><text x="450" y="625" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" dominant-baseline="middle" fill="#6b7280">Full handshake: a few kB and 2 to 3 round trips.  Resumption: hundreds of bytes, 1 round trip.  CID record: payload plus a handful of bytes.</text></svg>